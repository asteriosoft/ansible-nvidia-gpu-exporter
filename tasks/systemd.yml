---
- name: create user for exporter
  user: 
    name: '{{ nvidia_gpu_exporter_user }}'

- name: getting exporter tarball
  get_url:
    url: 'https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v{{ nvidia_gpu_exporter_version }}/nvidia_gpu_exporter_{{ nvidia_gpu_exporter_version }}_linux_{{ nvidia_gpu_exporter_arch }}.tar.gz'
    dest: '/tmp/nvidia-gpu-exporter.tar.gz'
    mode: 0444

- name: unpacking exporter tarball
  unarchive:
    src: '/tmp/nvidia-gpu-exporter.tar.gz'
    dest: '/usr/bin'
    remote_src: yes
    exclude:
      - LICENSE
  ignore_errors: '{{ ansible_check_mode }}'
  notify:
    - service restart

- name: create systemd unit
  template:
    src: 'systemd/unit.j2'
    dest: '/etc/systemd/system/nvidia_gpu_exporter.service'
    owner: root
    group: root
    mode: 0644
  register: result

- name: systemd reload
  systemd:
    daemon_reload: yes
  notify:
    - service restart
  when: result.changed

- name: starting exporter
  service:
    name: nvidia_gpu_exporter
    enabled: yes
    state: started
  ignore_errors: '{{ ansible_check_mode }}'
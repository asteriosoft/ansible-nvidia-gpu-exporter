---
- name: check docker is installed
  command: docker --version
  ignore_errors: yes
  register: docker_installed

- name: install docker packages
  block:
    - name: add an apt signing key for docker repo
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker-keyring.gpg

    - name: add docker repo
      apt_repository:
        repo: 'deb [arch=amd64 signed-by=/usr/share/keyrings/docker-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
        state: present

    - name: update apt cache
      apt:
        update_cache: yes

    - name: install docker packages
      package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present  
  when: docker_installed.failed

- name: fix 'https://github.com/NVIDIA/nvidia-container-toolkit/issues/48' issue
  block:
    - name: start nvidia gpu exporter docker container service
      command: 'nvidia-ctk system create-dev-char-symlinks --create-all'

    - name: create symlinks for nvidia devices
      blockinfile:
        path: /lib/udev/rules.d/71-nvidia-dev-char.rules
        create: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        prepend_newline: true
        block: |
          # This will create /dev/char symlinks to all device nodes
          ACTION=="add", DEVPATH=="/bus/pci/drivers/nvidia", RUN+="/usr/bin/nvidia-ctk system create-dev-char-symlinks --create-all"

- name: create nvidia gpu exporter working directory
  file:
    path: '{{ nvidia_gpu_exporter_host_path }}'
    state: directory
    mode: 0755
    owner: 'root'
    group: 'root'

- name: copy docker compose file
  template:
    src: 'dokcer/docker-compose.yml'
    dest: '{{ nvidia_gpu_exporter_host_path }}/docker-compose.yml'
    mode: 0644
    owner: 'root'
    group: 'root'
  register: res_compose_copy

- name: start nvidia gpu exporter docker container service
  command: 'docker compose -f {{ nvidia_gpu_exporter_host_path }}/docker-compose.yml up -d'
  register: res_compose_start
  when: res_compose_copy.changed